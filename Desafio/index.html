<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css">
  <title>Lista de Tarefas</title>
</head>

<body>
  <div id="container">
    <img src="./img/Logo.png" class="logo_img" />

    
    <section class="sectionBody">
      <div class="containerInput">
        <h2 class="titleBody">Sua lista de tarefas da semana</h2>
        <div class="form">
          <input type="text" class="espacoTare" placeholder="Digite suas tarefa" />
          <button type="button" class="addTask">Adicionar Tarefa</button>
        </div>
      </div>

      <div class="containerList">
        <ul id="listaTask" class="listaTask">
          
        </ul>
      </div>
    </section>
  </div>
  <script src="scripts.js"></script>
</body>

</html>
