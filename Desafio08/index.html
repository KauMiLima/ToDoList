<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css">
  <title>Lista de Tarefas</title>
</head>

<body>
  <div id="container">
    <h1 class="inicio">Incode Tech School</h1>

    <h2 class="titleBody">Sua lista de Tarefas da semana</h2>
    <section class="sectionBody">
      <div class="containerInput">
        <input type="text" class="espaçoTare" placeholder="Digite sua Tarefa" />
        <button type="button" class="addTask">Adicionar Tarefa</button>
      </div>

      <div class="containerList">
        <ul id="listaTask" class="listaTask">
        </ul>
      </div>
    </section>
  </div>
  <script src="scripts.js"></script>
</body>

</html>
